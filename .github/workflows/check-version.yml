name: Track KeePass Version

on:
  schedule:
    - cron: '0 0 * * *' # Checks every day at midnight
  workflow_dispatch: # Allows you to run it manually

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Latest KeePass Classic Version
        id: get_version
        run: |
          VERSION=$(curl -s https://keepass.info | grep -oE "KeePass [0-9]+\.[0-9]+(\.[0-9]+)?" | head -n 1)
          echo "CURRENT_VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Found Version: $VERSION"

      - name: Send Notification to Mattermost
        run: |
          curl -i -X POST -H 'Content-Type: application/json' \
            -d "{\"text\": \"🔔 **KeePass Update Detected:** Official website is now listing version **$VERSION**\"}" \
            https://chat.sabay.com/hooks/jrqhrmuj1inrbqihxrufc71f3e
