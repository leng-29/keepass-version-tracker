name: Track KeePass Version

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Latest KeePass Version
        id: fetch
        run: |
          VERSION=$(curl -s https://keepass.info | grep -oE "KeePass [0-9]+\.[0-9]+(\.[0-9]+)*" | head -n 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest version found: $VERSION"

      - name: Restore Previous Version State
        uses: actions/cache/restore@v4
        with:
          path: last_version.txt
          key: keepass-version-state

      - name: Compare Versions & Send Notification
        run: |
          NEW_VERSION="${{ steps.fetch.outputs.version }}"
          OLD_VERSION=""

          if [ -f last_version.txt ]; then
            OLD_VERSION=$(cat last_version.txt)
          fi

          echo "Previous recorded version: '$OLD_VERSION'"
          echo "Current detected version:  '$NEW_VERSION'"

          if [ -n "$NEW_VERSION" ] && [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
            echo "New version detected! Sending notification..."
            
            MESSAGE=$(printf "🔔 **New KeePass Update Available:** Official website is now listing **%s**\n\n📥 [Download KeePass here](https://keepass.info/download.html)" "$NEW_VERSION")

            curl -i -X POST -H 'Content-Type: application/json' \
              -d "$(jq -n --arg msg "$MESSAGE" '{text: $msg}')" \
              https://chat.sabay.com/hooks/jrqhrmuj1inrbqihxrufc71f3e

            echo "$NEW_VERSION" > last_version.txt
          else
            echo "No new version found or invalid version string. Staying silent."
          fi

      - name: Save Updated Version State
        if: always()
        uses: actions/cache/save@v4
        with:
          path: last_version.txt
          key: keepass-version-state-${{ github.run_id }}
